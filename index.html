<script>
const KART = {
  telefonOfis: "+55 11 3065 0300",
  telefonCep:  "+55 11 92058 4455",
  whatsapp:    "+55 11 92058 4455",
  eposta:   "saopaulo@trade.gov.tr",
  web:      "www.trade.gov.tr",
  linkedin: "https://www.linkedin.com/in/recep-serhat-saru-90234428/",
  adres: {
    sokak: "Av. Chedid Jafet, 222, Bloco A, Conj. 42",
    semt:  "Vila Olímpia",
    sehir: "São Paulo",
    eyalet:"SP",
    posta: "04551-065",
    ulke:  "BRASIL",
  },
  tr: {
    ad:    "Recep Serhat SARU",
    unvan: "Ticaret Ataşesi",
    kurum: "T.C. São Paulo Başkonsolosluğu",
    birim: "Ticaret Ataşeliği",
  },
  en: {
    ad:    "Recep Serhat SARU",
    unvan: "Trade Attaché",
    kurum: "Consulate General of Türkiye in São Paulo",
    birim: "Trade Attaché Office",
  },
  pt: {
    ad:    "Recep Serhat SARU",
    unvan: "Adido Comercial",
    kurum: "Consulado-Geral da Türkiye em São Paulo",
    birim: "Escritório Comercial",
  },

const UI = {
  tr:{ add:"Rehbere Ekle", callOfis:"Ofis", callCep:"Cep", whatsapp:"WhatsApp", email:"E-posta", linkedin:"LinkedIn",
       qrNote:"Bu kartı açmak için kodu taratın", share:"Bağlantıyı paylaş", copied:"Bağlantı kopyalandı",
       map:"Haritada aç", foot:"kişisel · iletişim kartı", LA:"ADRES", langs:"Dil seçimi" },
  en:{ add:"Add to Contacts", callOfis:"Office", callCep:"Mobile", whatsapp:"WhatsApp", email:"Email", linkedin:"LinkedIn",
       qrNote:"Scan to open this card", share:"Share link", copied:"Link copied",
       map:"Open in maps", foot:"personal · contact card", LA:"ADDRESS", langs:"Language" },
  pt:{ add:"Adicionar aos Contatos", callOfis:"Fixo", callCep:"Celular", whatsapp:"WhatsApp", email:"E-mail", linkedin:"LinkedIn",
       qrNote:"Escaneie para abrir este cartão", share:"Compartilhar link", copied:"Link copiado",
       map:"Abrir no mapa", foot:"cartão de contato pessoal", LA:"ENDEREÇO", langs:"Idioma" },
};
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --gold:#C8992E; --gold-deep:#A87E1E;
    --ink:#53565A; --ink-strong:#2E3033; --ink-soft:#707377;
    --line:#D2D3D1; --surface:#FFFFFF;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Source Sans 3",system-ui,sans-serif;color:var(--ink);
    background:#EBEBEA radial-gradient(120% 80% at 50% -10%, #F6F6F5 0%, #EBEBEA 60%, #DAD9D6 100%);
    min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;
  }
  .card{
    width:100%;max-width:380px;background:var(--surface);
    border:1px solid var(--line);border-radius:6px;
    box-shadow:0 1px 0 rgba(0,0,0,.03), 0 20px 48px -28px rgba(0,0,0,.4);
    position:relative;padding:30px 28px 26px;text-align:center;
  }
  .lang{
    position:absolute;top:16px;right:16px;display:flex;
    border:1px solid var(--line);border-radius:999px;overflow:hidden;
    font-size:11px;background:#fff;
  }
  .lang button{
    border:0;background:transparent;color:var(--ink);
    padding:6px 11px;cursor:pointer;font:inherit;font-weight:600;letter-spacing:.03em;
    transition:background .15s ease,color .15s ease;
  }
  .lang button + button{border-left:1px solid var(--line);}
  .lang button[aria-pressed="true"]{background:var(--ink-strong);color:#fff;}

  .logo{width:104px;height:80px;display:block;margin:12px auto 20px;}
  .logo .fill{fill:var(--gold);}

  .name{
    font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:28px;
    line-height:1.1;letter-spacing:-.01em;color:var(--ink-strong);margin-bottom:5px;
  }
  .title{
    font-family:"Source Serif 4",Georgia,serif;font-weight:500;font-size:15px;
    font-style:italic;color:var(--ink);margin-bottom:20px;
  }
  .org{
    border-top:1px solid var(--line);padding-top:16px;margin-bottom:14px;
  }
  .org b{display:block;font-size:13px;font-weight:600;color:var(--ink-strong);line-height:1.35;}
  .org span{display:block;font-size:12.5px;color:var(--gold-deep);font-weight:600;margin-top:2px;}

  .addr{
    display:flex;gap:12px;text-align:left;font-size:12px;line-height:1.4;
    color:var(--ink-strong);border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:22px;
  }
  .addr i{
    font-style:normal;color:var(--gold-deep);min-width:58px;flex-shrink:0;font-weight:600;
    font-size:10.5px;letter-spacing:.08em;padding-top:1px;
  }
  .addr a{color:inherit;text-decoration:none;}
  .addr a:hover .maplbl,.addr a:focus-visible .maplbl{text-decoration:underline;}
  .maplbl{display:block;margin-top:3px;font-size:11px;font-weight:600;color:var(--gold-deep);}

  .btn{
    display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    border:1px solid var(--ink-strong);background:var(--ink-strong);color:#fff;
    font-family:"Source Sans 3",sans-serif;font-size:15px;font-weight:600;
    padding:13px;border-radius:4px;cursor:pointer;text-decoration:none;
    transition:transform .12s ease, opacity .15s ease;
  }
  .btn:hover{transform:translateY(-1px);opacity:.92;}
  .btn:active{transform:translateY(0);}

  .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;}
  .mini{
    flex:1 1 84px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink-strong);
    padding:11px 4px;font-size:12px;font-weight:600;text-decoration:none;cursor:pointer;
    white-space:nowrap;
    transition:border-color .15s ease, color .15s ease;
  }
  .mini:hover{border-color:var(--gold);color:var(--gold-deep);}

  a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  .qrwrap{margin-top:20px;border-top:1px dashed var(--line);padding-top:18px;text-align:center;}
  #qr{display:inline-block;padding:10px;background:#fff;border:1px solid var(--line);border-radius:4px;}
  #qr img,#qr canvas{display:block;}
  .qrnote{font-size:11px;color:var(--ink);margin-top:10px;letter-spacing:.04em;}
  .share{
    margin-top:10px;border:1px solid var(--line);background:#fff;color:var(--ink-strong);
    font:inherit;font-size:12px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;
  }
  .share:hover{border-color:var(--gold);color:var(--gold-deep);}

  .web{display:inline-block;margin-top:18px;font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--gold-deep);text-decoration:none;}
  .web:hover{text-decoration:underline;}
  .foot{
    margin-top:18px;font-size:10px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-soft);
  }
  @media (max-width:360px){ .card{padding:26px 18px 22px;} .name{font-size:25px;} }
  @media (prefers-reduced-motion:reduce){.btn:hover{transform:none;}}
  @media print{
    body{background:#fff;padding:0;} .card{box-shadow:none;}
    .lang,.share,#vcardBtn{display:none;}
  }
</style>
</head>
<body>
  <main class="card">
    <div class="lang" role="group" id="langGroup" aria-label="Language">
      <button type="button" data-lang="tr" lang="tr" aria-pressed="false">TR</button>
      <button type="button" data-lang="en" lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="pt" lang="pt" aria-pressed="false">PT</button>
    </div>

    <svg class="logo" viewBox="0 0 210 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Türkiye">
      <defs><mask id="cres">
        <rect width="210" height="160" fill="#000"/>
        <circle cx="72" cy="80" r="54" fill="#fff"/>
        <circle cx="90" cy="80" r="43" fill="#000"/>
      </mask></defs>
      <rect class="fill" width="210" height="160" mask="url(#cres)"/>
      <polygon class="fill" points="105.0,80.0 122.9,73.4 123.7,54.3 135.5,69.3 153.8,64.1 143.3,80.0 153.8,95.9 135.5,90.7 123.7,105.7 122.9,86.6"/>
    </svg>

    <h1 class="name" id="ad"></h1>
    <p class="title" id="unvan"></p>

    <div class="org">
      <b id="kurum"></b>
      <span id="birim"></span>
    </div>

    <div class="addr">
      <i id="la"></i>
      <a id="adresLink" target="_blank" rel="noopener"><span id="adres"></span><span class="maplbl" id="mapLbl"></span></a>
    </div>

    <button type="button" class="btn" id="vcardBtn"><span aria-hidden="true">&#8595;</span> <span id="addLbl"></span></button>
    <div class="row" id="actions"></div>

    <div class="qrwrap" id="qrwrap">
      <div id="qr"></div>
      <div class="qrnote" id="qrNote"></div>
      <button type="button" class="share" id="shareBtn"></button>
    </div>

    <a class="web" id="webLink" target="_blank" rel="noopener"></a>
    <div class="foot" id="foot"></div>
  </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const LANGS = ["tr","en","pt"];
  const A = KART.adres;
  const adresMetni = [A.sokak, [A.semt, A.sehir].filter(Boolean).join(" - "), [A.posta.replace("-","\u2011"), A.eyalet].filter(Boolean).join(" ") + (A.ulke ? ", " + A.ulke : "")].filter(Boolean).join(" · ");
  const digits = s => String(s).replace(/[^\d+]/g,"");
  const webUrl = KART.web ? "https://" + KART.web.replace(/^https?:\/\//,"") : "";
  const baseUrl = location.origin + location.pathname;

  // Dil önceliği: ?lang= parametresi > son seçim > tarayıcı dili > EN
  function initialLang(){
    const p = new URLSearchParams(location.search).get("lang");
    if (LANGS.includes(p)) return p;
    try { const s = localStorage.getItem("kartLang"); if (LANGS.includes(s)) return s; } catch(e){}
    const nav = (navigator.languages || [navigator.language || ""]).map(x => String(x).slice(0,2).toLowerCase());
    return nav.find(x => LANGS.includes(x)) || "en";
  }
  let lang = initialLang();
  let qr = null, shareTimer = null;

  function cardUrl(){ return baseUrl + "?lang=" + lang; }

  function render(){
    const d=KART[lang], u=UI[lang];
    document.documentElement.lang=lang;
    $("ad").textContent=d.ad;
    $("unvan").textContent=d.unvan;
    $("kurum").textContent=d.kurum;
    $("birim").textContent=d.birim;
    $("la").textContent=u.LA;
    $("adres").textContent=adresMetni;
    $("mapLbl").textContent=u.map + " ↗";
    $("adresLink").href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([A.sokak,A.semt,A.sehir,A.eyalet,A.posta,"Brasil"].filter(Boolean).join(", "));
    $("addLbl").textContent=u.add;
    $("foot").textContent=u.foot;
    $("qrNote").textContent=u.qrNote;
    $("shareBtn").textContent=u.share;
    $("langGroup").setAttribute("aria-label", u.langs);
    const w=$("webLink"); w.textContent=KART.web; w.href=webUrl; w.hidden=!KART.web;

    const items=[
      KART.telefonOfis && {t:u.callOfis, href:"tel:"+digits(KART.telefonOfis)},
      KART.telefonCep  && {t:u.callCep,  href:"tel:"+digits(KART.telefonCep)},
      KART.whatsapp    && {t:u.whatsapp, href:"https://wa.me/"+digits(KART.whatsapp).replace("+",""), ext:true},
      KART.eposta      && {t:u.email,    href:"mailto:"+KART.eposta},
      KART.linkedin    && {t:u.linkedin, href:KART.linkedin, ext:true},
    ].filter(Boolean);
    const act=$("actions"); act.innerHTML="";
    items.forEach(i=>{
      const a=document.createElement("a");
      a.className="mini";a.textContent=i.t;a.href=i.href;
      if(i.ext){a.target="_blank";a.rel="noopener";}
      act.appendChild(a);
    });

    document.querySelectorAll("#langGroup button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));
    drawQR();
  }

  function drawQR(){
    if (typeof QRCode === "undefined") { $("qr").hidden = true; return; }
    if (!qr) {
      qr = new QRCode($("qr"),{text:cardUrl(),width:168,height:168,
        colorDark:"#2E3033",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
    } else { qr.clear(); qr.makeCode(cardUrl()); }
  }

  function setLang(l){
    if (!LANGS.includes(l)) return;
    lang=l;
    try { localStorage.setItem("kartLang", l); } catch(e){}
    try { history.replaceState(null, "", "?lang="+l + location.hash); } catch(e){}
    render();
  }
  document.querySelectorAll("#langGroup button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));

  $("shareBtn").addEventListener("click", async ()=>{
    const d=KART[lang], url=cardUrl();
    if (navigator.share) {
      try { await navigator.share({title:d.ad + " – " + d.unvan, url}); return; }
      catch(e){ if (e && e.name === "AbortError") return; }
    }
    try { await navigator.clipboard.writeText(url); }
    catch(e){ window.prompt(UI[lang].share, url); return; }
    const b=$("shareBtn"); b.textContent=UI[lang].copied;
    clearTimeout(shareTimer); shareTimer=setTimeout(()=>{ b.textContent=UI[lang].share; },2000);
  });

  $("vcardBtn").addEventListener("click",()=>{
    const d=KART[lang];
    const parts=d.ad.trim().split(/\s+/);
    const family=parts.pop(); const given=parts.join(" ");
    const esc = s => String(s).replace(/([,;\\])/g,"\\$1").replace(/\r?\n/g,"\\n");
    const v=[
      "BEGIN:VCARD","VERSION:3.0",
      `N:${esc(family)};${esc(given)};;;`,
      `FN:${esc(d.ad)}`,
      `ORG:${esc(d.kurum)};${esc(d.birim)}`,
      `TITLE:${esc(d.unvan)}`,
      KART.telefonOfis && `TEL;TYPE=WORK,VOICE:${digits(KART.telefonOfis)}`,
      KART.telefonCep  && `TEL;TYPE=CELL:${digits(KART.telefonCep)}`,
      KART.eposta   && `EMAIL;TYPE=INTERNET,WORK:${KART.eposta}`,
      webUrl        && `URL;TYPE=WORK:${webUrl}`,
      KART.linkedin && `URL;TYPE=LinkedIn:${KART.linkedin}`,
      `ADR;TYPE=WORK:;;${esc([A.sokak,A.semt].filter(Boolean).join(" - "))};${esc(A.sehir)};${esc(A.eyalet)};${esc(A.posta)};${esc(A.ulke)}`,
      "END:VCARD",
    ].filter(Boolean).join("\r\n") + "\r\n";
    const url=URL.createObjectURL(new Blob([v],{type:"text/vcard;charset=utf-8"}));
    const a=document.createElement("a");
    a.href=url;a.download=d.ad.replace(/\s+/g,"_")+".vcf";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
  });

  render();
</script>
